<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#164b38" />
  <title>Admin Harga | Bali Tana Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .admin-page{min-height:100vh;padding:110px 0 70px;background:var(--cream)}
    .admin-card{max-width:620px;margin:auto;padding:clamp(24px,5vw,42px);background:#fff;box-shadow:0 8px 28px #2733290a}
    .admin-card h1{font:500 clamp(34px,6vw,48px)/1.1 var(--serif);color:var(--forest);margin:0 0 12px}
    .admin-card>p{font-size:13px;color:#70776f;margin:0 0 26px}
    .admin-card label{display:block;font-size:11px;font-weight:700;color:#38443a;margin:0 0 16px}
    .admin-card input,.admin-card select{display:block;width:100%;margin-top:7px;padding:13px;border:1px solid #e0dfd5;background:#fff;font:inherit;font-size:14px}
    .admin-card input:focus,.admin-card select:focus{outline:2px solid var(--green);outline-offset:2px}
    .admin-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
    .admin-status{min-height:24px;margin:16px 0 0!important;color:var(--forest)!important;font-size:12px!important}
    .admin-back{display:inline-block;margin-bottom:24px;color:var(--forest);font-size:12px;font-weight:700}
    .admin-hidden{display:none!important}
  </style>
</head>
<body>
  <main class="admin-page">
    <div class="wrap">
      <a class="admin-back" href="index.html">← Kembali ke website</a>
      <section class="admin-card" aria-labelledby="admin-title">
        <span class="eyebrow">Bali Tana Tour</span>
        <h1 id="admin-title">Admin harga tur</h1>
        <p>Masuk menggunakan akun admin Supabase untuk memperbarui harga Ubud Cultural Tour.</p>

        <form id="login-form">
          <label>Email admin<input name="email" type="email" autocomplete="username" required></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
          <button class="button button-green" type="submit">Masuk <span>↗</span></button>
        </form>

        <form id="price-form" class="admin-hidden">
          <label>Pilih tur<select id="tour-select" required><option value="ubud-cultural-tour">Ubud Cultural Tour</option><option value="beautiful-temple-hidden-hill">Beautiful Temple and Hidden Hill</option><option value="east-bali-tour">East Bali Tour</option></select></label>
          <label>Harga tur (Rupiah)<input id="price-input" type="number" min="0" step="1000" required></label>
          <div class="admin-actions">
            <button class="button button-green" type="submit">Simpan harga <span>↗</span></button>
            <button class="button" id="logout-button" type="button">Keluar</button>
          </div>
        </form>
        <p class="admin-status" id="admin-status" role="status" aria-live="polite"></p>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
